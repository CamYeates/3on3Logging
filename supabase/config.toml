# Minimal Supabase CLI config for local development.
# Run `supabase start` to spin up a local stack, then `supabase db reset`
# to apply migrations + seed.sql.

project_id = "3on3-logging"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public"]

[studio]
port = 54323

[auth]
enabled = true
# For the MVP you can use anonymous/email auth. Configure providers as needed.
